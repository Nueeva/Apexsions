; Apexsions VPS Tuning for 2 GB RAM (ECO Memory-Optimized)
; Location: /etc/php/8.3/fpm/pool.d/www.conf or conf.d/

[www]
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

; Memory limit tailored for 2 GB RAM
php_admin_value[memory_limit] = 128M
php_admin_value[post_max_size] = 32M
php_admin_value[upload_max_filesize] = 32M

; OPcache settings to minimize CPU parsing
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 64
php_admin_value[opcache.interned_strings_buffer] = 8
php_admin_value[opcache.max_accelerated_files] = 10000
