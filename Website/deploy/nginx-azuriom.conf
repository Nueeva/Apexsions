# Apexsions Azuriom Nginx Virtual Host
# Location: /etc/nginx/sites-available/azuriom

# ==============================================================================
# 1. Catch-All Default Server (Host Protection & 301 Permanent SEO Redirect)
# Catches foreign/rogue domains (e.g. professionelle-dachsanierung.com) or direct IP hits,
# and permanently 301 redirects them to the authoritative official domain.
# Transfers link equity, Google indexing, and organic traffic to web.apexsions.my.id.
# ==============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://web.apexsions.my.id$request_uri;
}

# ==============================================================================
# 2. Apexsions Official Virtual Host
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name web.apexsions.my.id apexsions.my.id localhost 127.0.0.1;

    root /var/www/azuriom/public;
    index index.php index.html;

    client_max_body_size 32M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Cloudflare Real IP Restoration
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # BlueMap 3D Server Map Reverse Proxy
    location /bluemap/ {
        proxy_pass http://101.50.1.132:32076/;
        proxy_set_header Host apexsions.my.id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        proxy_connect_timeout 5;
    }

    location ~ ^/vote[\)\s]+$ { return 301 https://web.apexsions.my.id/vote; }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
        default_type application/xml;
        add_header X-Robots-Tag "all" always;
    }

    location = /robots.txt {
        try_files /robots.txt =404;
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 180;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Static Assets Caching
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
