# ==============================================================================
# Apexsions — Chat System & Formatting (chat.yml)
# ==============================================================================

# Enabled state (Disabled here to delegate all chat responsibilities to ApexsionsChat)
enabled: false

# Chat template format supporting Adventure MiniMessage tags:
# Available placeholders:
#   {level}   - Player progression level (1–100)
#   {title}   - Kingdom level title (e.g. Acolyte of Zenith, Dune Wanderer)
#   {rank}    - Primary rank / prefix from LuckPerms
#   {kingdom} - Styled kingdom tag with official theme colors
#   {player}  - Sender username
#   {message} - Message content
format: "<gray>[<yellow>Lv. {level} <gold>{title}</gold></yellow>]</gray> <gray>[<white>{rank}</white>]</gray> {kingdom} <white>{player}</white> <dark_gray>»</dark_gray> <white>{message}</white>"

# Official theme color formatting for kingdom chat tags
kingdom-tags:
  none: "<gray>[Unpledged]</gray>"
  ZENITHAR: "<yellow>[<gradient:#ffe900:#f39c12><bold>Zenithar</bold></gradient>]</yellow>"
  SOLTERRA: "<red>[<gradient:#ff4d4d:#c0392b><bold>Solterra</bold></gradient>]</red>"
  SYLVAMOOR: "<aqua>[<gradient:#87ceeb:#3498db><bold>Sylvamoor</bold></gradient>]</aqua>"

# Default fallback rank if LuckPerms is not available
default-rank: "Wanderer"
