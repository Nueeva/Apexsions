# ==============================================================================
# Apexsions — KingdomCore Main Configuration (config.yml)
# Modular YAMLs: kingdoms.yml, titles.yml, xp.yml, rewards.yml, messages.yml, gui.yml
# ==============================================================================

server:
  name: "Apexsions"

database:
  # Database type: 'postgresql' (production standard) or 'sqlite' / 'h2' (local dev fallback)
  type: "postgresql"
  host: "localhost"
  port: 5432
  database: "kingdomcore"
  username: "postgres"
  password: "password"
  pool:
    maximum-pool-size: 10
    minimum-idle: 2
    idle-timeout: 600000
    connection-timeout: 30000
    max-lifetime: 1800000
  # Automatically fallback to local SQLite (database.db) if PostgreSQL cannot be reached
  auto-fallback: true

locations:
  lobby:
    world: "world"
    x: 0.5
    y: 100.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

level:
  min: 1
  max: 100
  # Base XP multiplier: required XP = base * (level ^ exponent)
  formula:
    base: 100
    exponent: 1.5
  # Behavior on max level (100): allow_overflow (true) or cap_xp (false)
  allow-overflow: false

bluemap:
  enabled: true
  # Path to BlueMap world.conf (relative to server root or plugins/BlueMap/maps/world.conf)
  config-path: "world.conf"
  # Synchronize kingdom spawn locations with BlueMap marker positions
  sync-spawns: true
  # Display title/actionbar when player walks into kingdom territory
  territory-actionbar: true

rtp:
  # Cooldown between /rtp uses in seconds (bypass permission: apexsionscore.rtp.bypass)
  cooldown-seconds: 60
  # Maximum retry attempts to find safe location within kingdom polygon
  max-attempts: 30
  # Padding distance from territory polygon borders (blocks)
  boundary-margin: 16

motd:
  enabled: true
  line-1: "      <gradient:#f1c40f:#e67e22><bold>✦ APEXSIONS KINGDOM ✦</bold></gradient> <gray>•</gray> <aqua><bold>[1.21.4]</bold></aqua>"
  lines-2:
    - "   <gradient:#00c6ff:#0072ff>⚔ PERANG TIGA KERAJAAN & EKONOMI REALM ⚔</gradient>"
    - "  <gradient:#2ecc71:#f1c40f>🌟 MUSIM BARU TELAH DIBUKA • GABUNG SEKARANG! 🌟</gradient>"
    - "   <gradient:#e74c3c:#f39c12>👑 PILIH KERAJAANMU: ZENITHAR • SOLTERRA • SYLVAMOOR</gradient>"
  hover-sample:
    - "<gradient:#f1c40f:#e67e22><bold>✦ APEXSIONS KINGDOM NETWORK ✦</bold></gradient>"
    - "<gray>Server Version:</gray> <yellow>Minecraft 1.21.4</yellow>"
    - "<gray>Kingdoms:</gray> <gold>Zenithar</gold> <gray>•</gray> <red>Solterra</red> <gray>•</gray> <green>Sylvamoor</green>"
    - "<gray>Fitur:</gray> <aqua>Custom Economy, Auction, BattlePass, War</aqua>"
    - " "
    - "<green>▶ Klik dua kali untuk bergabung ke server!</green>"

