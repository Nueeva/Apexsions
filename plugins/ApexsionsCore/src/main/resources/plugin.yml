name: ApexsionsCore
version: '1.0.0'
main: com.apexsions.core.ApexsionsCorePlugin
api-version: '1.21'
author: Antigravity
description: Core server management plugin for Apexsions Realms, Progression, XP, Level Titles, Ranks, and Chat.
softdepend:
  - LuckPerms
  - Vault
  - PlaceholderAPI
  - Essentials
  - BlueMap
  - Citizens
  - Multiverse-Core


commands:
  lobby:
    description: Teleport to the main server lobby.
    permission: apexsionscore.command.lobby
    usage: /lobby
  region:
    aliases:
      - kingdom
      - kingdoms
      - k
    description: Region / Realm navigation, selection, and information.
    permission: apexsionscore.command.region
    usage: /region [choose|info]
  kingdom:
    aliases:
      - k
      - kingdoms
    description: Realm / Kingdom navigation, selection, and information.
    permission: apexsionscore.command.region
    usage: /kingdom [choose|info]
  apexsionscore:
    aliases:
      - ac
      - apexionscore
      - kingdomcore
      - kc
    description: Administrative management for ApexsionsCore.
    permission: apexsionscore.admin
    usage: /apexsionscore <reload|setlevel|addxp|setkingdom|info>
  apexionscore:
    aliases:
      - ac
      - kc
    description: Alias for ApexsionsCore admin management.
    permission: apexsionscore.admin
    usage: /apexionscore <reload|setlevel|addxp|setkingdom|info>
  kingdomcore:
    aliases:
      - kc
    description: Legacy alias for ApexsionsCore admin management.
    permission: apexsionscore.admin
    usage: /kingdomcore <reload|setlevel|addxp|setkingdom|info>
  level:
    aliases:
      - lvl
      - profile
      - rewards
      - exp
      - xpguide
    description: View character profile, level progression, rewards, and XP guide.
    permission: apexsionscore.command.level
    usage: /level
  rtp:
    aliases:
      - wild
      - wilderness
      - krtp
      - randomteleport
      - rtpkingdom
    description: Random teleport strictly inside your pledged kingdom territory.
    permission: apexsionscore.command.rtp
    usage: /rtp
  wild:
    aliases:
      - wilderness
    description: Random teleport strictly inside your pledged kingdom territory.
    permission: apexsionscore.command.rtp
    usage: /wild
  warp:
    aliases:
      - warps
    description: Open warp navigation GUI or teleport to a specific warp location.
    permission: apexsionscore.command.warp
    usage: /warp [name|admin|set|del]
  warps:
    description: Open the interactive warp navigation menu.
    permission: apexsionscore.command.warp
    usage: /warps
  warpmgr:
    aliases:
      - warpadmin
    description: Open interactive Admin Warp Management GUI.
    permission: apexsionscore.warp.admin
    usage: /warpmgr
  admingui:
    aliases:
      - apexadmin
      - aadmin
      - aa
    description: Open the Centralized Master Admin Hub for all Apexsions plugins.
    permission: apexsions.admin.gui
    usage: /admingui [module|reload]
  apexadmin:
    description: Open the Centralized Master Admin Hub for all Apexsions plugins.
    permission: apexsions.admin.gui
    usage: /apexadmin
  aadmin:
    description: Open the Centralized Master Admin Hub for all Apexsions plugins.
    permission: apexsions.admin.gui
  titles:
    aliases:
      - tags
      - title
      - tag
    description: Open the Title Vault GUI to equip prestige titles and honorific badges.
    permission: apexsionscore.command.titles
    usage: /titles
  cosmetics:
    aliases:
      - aura
      - auras
      - trail
      - trails
    description: Open the Particle Cosmetics GUI for Head Auras, Footstep Trails, and Kill Effects.
    permission: apexsionscore.command.cosmetics
    usage: /cosmetics
  rank:
    aliases:
      - ranks
      - ranklist
    description: Open the interactive Rank Hierarchy and Donator Perks menu.
    permission: apexsionscore.command.rank
    usage: /rank
  ranks:
    description: Open the interactive Rank Hierarchy and Donator Perks menu.
    permission: apexsionscore.command.rank
    usage: /ranks

permissions:
  apexsionscore.command.rank:
    description: Allows viewing the Rank Hierarchy GUI.
    default: true
  apexsionscore.command.titles:
    description: Allows accessing the Title Vault GUI.
    default: true
  apexsionscore.command.cosmetics:
    description: Allows accessing the Particle Cosmetics GUI.
    default: true
  apexsions.admin.gui:
    description: Allows accessing the Centralized Master Admin Hub (/admingui).
    default: op
  apexsionscore.command.warp:
    description: Allows using /warp and accessing public server warps.
    default: true
  apexsionscore.warp.admin:
    description: Allows managing warps, setting warps, and opening /warpmgr.
    default: op
  apexsionscore.warp.bypass:
    description: Bypasses warp teleportation countdown delay.
    default: op
  apexsionscore.command.lobby:
    description: Allows teleporting to the lobby.
    default: true
  apexsionscore.command.region:
    description: Allows teleporting to the player's realm/kingdom.
    default: true
  apexsionscore.command.level:
    description: Allows accessing level, profile, rewards, and XP guide.
    default: true
  apexsionscore.command.rtp:
    description: Allows random teleporting inside player's kingdom territory.
    default: true
  apexsionscore.rtp.bypass:
    description: Bypasses /rtp cooldown timer.
    default: op
  apexsionscore.admin:
    description: Allows access to administrative commands.
    default: op
  apexsionscore.admin.*:
    description: Wildcard administrative access for ApexsionsCore.
    default: op
    children:
      apexsionscore.admin: true
  apexionscore.command.lobby:
    default: true
  apexionscore.command.region:
    default: true
  apexionscore.command.level:
    default: true
  apexionscore.command.rtp:
    default: true
  apexionscore.admin:
    default: op
  kingdomcore.command.lobby:
    default: true
  kingdomcore.command.kingdom:
    default: true
  kingdomcore.command.level:
    default: true
  kingdomcore.command.rtp:
    default: true
  kingdomcore.admin:
    default: op
