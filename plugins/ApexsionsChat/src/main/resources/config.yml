# ==============================================================================
# ApexsionsChat — Main Configuration (config.yml)
# ==============================================================================

# Database persistence for Reports, Offline Mail, and Moderation Logs
database:
  type: "SQLITE" # SQLITE or POSTGRESQL
  sqlite:
    file: "chat_data.db"
  postgresql:
    host: "localhost"
    port: 5432
    database: "apexsions_chat"
    username: "postgres"
    password: "password"
    ssl: false
    maximum-pool-size: 10
    connection-timeout-ms: 10000

# Sound alerts for chat events
sounds:
  mention:
    enabled: true
    sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.2
  mail-received:
    enabled: true
    sound: "ITEM_BOOK_PAGE_TURN"
    volume: 1.0
    pitch: 1.0
  game-start:
    enabled: true
    sound: "BLOCK_NOTE_BLOCK_PLING"
    volume: 1.0
    pitch: 1.5
  game-win:
    enabled: true
    sound: "UI_TOAST_CHALLENGE_COMPLETE"
    volume: 1.0
    pitch: 1.0
  report-alert:
    enabled: true
    sound: "BLOCK_NOTE_BLOCK_BASS"
    volume: 1.0
    pitch: 0.8

# Item showcase settings
item-showcase:
  keywords:
    - "[item]"
    - "[i]"
    - "[hand]"
  format: "<gray>[</gray><gold>{item_name}</gold> <yellow>x{amount}</yellow><gray>]</gray>"
  hover-enabled: true

# Luxury Join and Quit server broadcast messages
join-quit-messages:
  enabled: true

