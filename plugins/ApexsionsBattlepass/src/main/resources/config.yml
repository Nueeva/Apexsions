# ====================================================== #
#               APEXSIONS BATTLEPASS CONFIG              #
# ====================================================== #

# System Timezone (e.g. Asia/Jakarta, UTC, America/New_York)
timezone: "Asia/Jakarta"

# Database storage type: SQLITE
storage:
  type: "SQLITE"
  sqlite-file: "battlepass.db"

# Battle Pass Level Settings
battlepass:
  max-level: 100
  # xp-mode: FIXED (sama per level) atau CUSTOM (mengikuti list required-xp per level)
  xp-mode: "CUSTOM"
  default-required-xp: 1000

# Daily Quest & Shop Reset Settings
resets:
  daily-reset-time: "00:00"

# Battle Pass Currency Configuration
currency:
  name: "Battle Coins"
  symbol: "Coins"
  format: "%amount% %symbol%"

# BattlePass Shop Refresh Configuration
shop:
  refresh:
    enabled: true
    base-cost: 50
    min-cost: 25
    max-cost: 500
    item-value-multiplier: 1.0
    scaling-per-refresh: 0.15
    cooldown-seconds: 3
    rarity-multipliers:
      COMMON: 1.0
      UNCOMMON: 1.2
      RARE: 1.5
      EPIC: 2.0
      LEGENDARY: 3.0
      MYTHIC: 5.0

