# ==========================================
# APEXSIONS: MONSTER RERUNTUHAN KERAJAAN SIONS
# ==========================================

# 1. Prajurit Mayat Hidup Kekaisaran Sions (Tier Pasukan Biasa - Lv 25)
SionsLegionnaire:
  Type: WITHER_SKELETON
  Display: '<#9b59b6>[Lv.25] <white>Sions Fallen Legionnaire</white>'
  Health: 150
  Damage: 12
  Armor: 8
  Faction: SionsEmpire
  AIGoalSelectors:
    - 0 clear
    - 1 meleeattack
    - 2 randomstroll
  AITargetSelectors:
    - 0 clear
    - 1 players
  Equipment:
    - IRON_SWORD HAND
    - CHAINMAIL_HELMET HEAD
    - IRON_CHESTPLATE CHEST
  Drops:
    - SionsCommonKey 1 0.15      # 15% peluang drop Kunci Biasa Sions
    - SionsAncientRelic 1 0.40   # 40% peluang drop relik
    - exp 45 1.0
  Skills:
    - skill{s=DarkShockwave} @self ~onDamaged =50% 1.0
    - message{m="<dark_gray>[Sions Guard]</dark_gray> <red>Kau tidak pantas menginjak tanah suci Sions...!</red>"} @PlayersInRadius{r=15} ~onCombat 0.2

# 2. Cecunguk Laba-Laba Perayap Void (Tier Minion - Lv 15)
SionsVoidCrawler:
  Type: CAVE_SPIDER
  Display: '<#8e44ad>[Lv.15] <gray>Sions Void Crawler</gray>'
  Health: 80
  Damage: 8
  Faction: SionsEmpire
  Options:
    MovementSpeed: 0.35
  Drops:
    - SionsCommonKey 1 0.12      # 12% drop Kunci Biasa
    - SionsAncientRelic 1 0.25
    - exp 25 1.0
  Skills:
    - potion{type=POISON;duration=60;level=1} @Target ~onAttack 0.5
    - effect:particles{p=portal;a=15;hs=0.3;vs=0.5} @self ~onTimer:10

# 3. Penyihir Kegelapan Sions (Tier Rahib Sihir - Lv 45)
SionsVoidChanneler:
  Type: ILLUSIONER
  Display: '<#8e44ad>[Lv.45] <light_purple>Sions Void Channeler</light_purple>'
  Health: 250
  Damage: 20
  Faction: SionsEmpire
  Options:
    FollowRange: 24
    MovementSpeed: 0.26
  Drops:
    - SionsEliteKey 1 0.35       # 35% drop Kunci Elit
    - CorruptedDarkCore 1 0.25   # 25% drop inti kegelapan
    - exp 90 1.0
  Skills:
    - skill{s=VoidPull} @Target ~onTimer:160 0.8
    - effect:particles{p=portal;a=30;hs=0.5;vs=1} @self ~onTimer:20

# 4. World Boss: Jenderal Korupsi Sions (Tier Mini-Boss - Lv 80)
GeneralVoranSions:
  Type: WARDEN
  Display: '<#c0392b><bold>[MINI-BOSS Lv.80]</bold> <gradient:#8e44ad:#c0392b>Voran, The Ruined Commander</gradient>'
  Health: 1500
  Damage: 35
  Armor: 20
  BossBar:
    Enabled: true
    Title: '<#8e44ad>Voran, Panglima Terakhir Kekaisaran Sions'
    Color: PURPLE
    Style: SEGMENTED_10
    Range: 40
  Drops:
    - SionsEliteKey 1 1.0        # 100% Kunci Elit
    - SionsAncientRelic 5-10 1.0
    - CorruptedDarkCore 2-4 1.0
    - exp 500 1.0
  Skills:
    - skill{s=DarkShockwave} @self ~onTimer:200
    - message{m="<dark_purple><bold>[VORAN]</bold></dark_purple> <gray>Kekuatan Dark Dimension abadi bersama kehancuran kita!</gray>"} @PlayersInRadius{r=30} ~onSpawn
