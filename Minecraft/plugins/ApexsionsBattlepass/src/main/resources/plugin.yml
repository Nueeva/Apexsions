name: ApexsionsBattlepass
version: '1.0.0'
main: com.apexsions.battlepass.ApexsionsBattlepass
api-version: '1.20'
authors: [ApexTeam]
description: Apexsions Battlepass - Modular, Modern, Scalable Battle Pass Plugin for Minecraft
softdepend: [Vault, PlaceholderAPI, ApexsionsEconomy]
commands:
  bp:
    description: Main player command for Apexsions Battlepass
    aliases: [battlepass]
    usage: /bp [info|quests|rewards|shop]
    permission: apexsionsbattlepass.use
    permission-message: "&cAnda tidak memiliki izin untuk menggunakan perintah ini."
  abp:
    description: Admin BattlePass Control Panel
    aliases: [apexsionsbattlepass, adminbp, bpadmin]
    usage: /abp [menu|givepass|setlevel|addxp|currency|reset|reload|season]
    permission: apexsionsbattlepass.admin
    permission-message: "&cAnda tidak memiliki izin untuk menggunakan perintah admin BattlePass."
permissions:
  apexsionsbattlepass.use:
    description: Allows accessing basic player battle pass features
    default: true
  apexsionsbattlepass.admin:
    description: Allows access to admin BattlePass features and GUI
    default: op
  apexsionsbattlepass.reload:
    description: Allows reloading configurations
    default: op
  apexsionsbattlepass.open:
    description: Allows opening battle pass GUI
    default: true
  apexsionsbattlepass.pass.free:
    description: Permission for Free Pass tier
    default: true
  apexsionsbattlepass.pass.premium:
    description: Permission for Premium Pass tier
    default: false
  apexsionsbattlepass.pass.vip:
    description: Permission for VIP Pass tier
    default: false


