name: ApexsionsCore
version: '1.0.0'
main: com.apexsions.core.ApexsionsCorePlugin
api-version: '1.21'
author: Nueeva
description: Core server management plugin for Apexsions Realms, Progression, XP, Level Titles, Ranks, and Chat.
softdepend:
  - LuckPerms
  - Vault
  - PlaceholderAPI
  - Essentials
  - BlueMap
  - Citizens
  - Multiverse-Core
  - AuthMe
  - Floodgate
  - nightcore
  - NightCore
  - ExcellentCrates


commands:
  sit:
    aliases:
      - duduk
      - chair
    description: Duduk santai di lantai atau kursi.
    permission: apexsions.pose.sit
    usage: /sit [player]
  lay:
    aliases:
      - lie
      - tidur
      - rebahan
    description: Berbaring / tiduran di lantai.
    permission: apexsions.pose.lay
    usage: /lay [player]
  crawl:
    aliases:
      - merangkak
      - tiarap
    description: Merangkak menembus lubang 1 blok.
    permission: apexsions.pose.crawl
    usage: /crawl [player]
  pose:
    description: Kelola pose dan emote karakter (sit, lay, crawl, bellyflop, spin, stand).
    usage: /pose <sit|lay|crawl|bellyflop|spin|stand> [player]
  deathcoords:
    aliases:
      - lastdeath
      - kor
      - cor
    description: Lihat koordinat lokasi kematian terakhir dan panduan navigasi kompas.
    permission: apexsions.core.deathcoords
    usage: /deathcoords [compass|<player>|tp <player>]
  grave:
    aliases:
      - tombstone
      - nisan
    description: Ambil kembali item & XP dari nisan kematian Anda.
    permission: apexsions.grave.use
    usage: /grave [open|list|compass|admin remove <player>]
  bounty:
    aliases:
      - bounties
      - buronan
      - headhunt
    description: Sistem hadiah kepala (bounty) antar pemain dan papan buronan.
    permission: apexsions.bounty.use
    usage: /bounty [list|add <player> <amount>|check <player>|top|hunters|admin]
  sort:
    aliases:
      - chestsort
    description: Rapikan & gabungkan isi peti/tong yang sedang dibuka.
    permission: apexsions.container.use
    usage: /sort
  deposit:
    aliases:
      - quickdeposit
      - quickdepo
    description: Setor cepat item inventory yang cocok ke peti yang sedang dibuka.
    permission: apexsions.container.use
    usage: /deposit
  caravan:
    aliases:
      - kafilah
      - blackmarket
    description: Buka pasar gelap kafilah keliling dan lihat status kemunculannya.
    permission: apexsions.caravan.use
    usage: /caravan [status|open|admin spawn|despawn|reload]
  vanish:
    aliases:
      - v
    description: Toggle staff vanish mode with fake leave/join notifications and full ghost mode.
    permission: apexsions.vanish
    usage: /vanish [-s|list|<player>]
  v:
    description: Shortcut for /vanish.
    permission: apexsions.vanish
    usage: /v [-s|list|<player>]
  sions:
    description: Sions Temporal Reconstruction administration and control.
    permission: apexsions.admin
    usage: /sions <status|restore|bypass|tp>
  maintenance:
    description: Server Maintenance Mode management.
    permission: apexsions.maintenance.admin
    usage: /maintenance <enable|disable|status|setmessage> [reason]
  link:
    description: Link in-game Minecraft account to Apexsions web platform.
    permission: apexsionscore.command.link
    usage: /link <pin>
  sync:
    aliases:
      - websync
    description: Synchronize player profile, balances, and BattlePass with web platform.
    usage: /sync
  vote:
    aliases:
      - voting
      - votes
    description: Dukung kedaulatan server Apexsions dan klaim imbalan Vote Keys serta saldo.
    usage: /vote
  lobby:
    description: Teleport to the main server lobby.
    permission: apexsionscore.command.lobby
    usage: /lobby
  region:
    aliases:
      - kingdom
      - kingdoms
      - k
    description: Region / Realm navigation, selection, and information.
    permission: apexsionscore.command.region
    usage: /region [choose|info]
  kingdom:
    aliases:
      - k
      - kingdoms
    description: Realm / Kingdom navigation, selection, and information.
    permission: apexsionscore.command.region
    usage: /kingdom [choose|info]
  apexsionscore:
    aliases:
      - ac
      - apexionscore
      - kingdomcore
      - kc
    description: Administrative management for ApexsionsCore.
    permission: apexsionscore.admin
    usage: /apexsionscore <reload|setlevel|addxp|setkingdom|info>
  apexionscore:
    aliases:
      - ac
      - kc
    description: Alias for ApexsionsCore admin management.
    permission: apexsionscore.admin
    usage: /apexionscore <reload|setlevel|addxp|setkingdom|info>
  kingdomcore:
    aliases:
      - kc
    description: Legacy alias for ApexsionsCore admin management.
    permission: apexsionscore.admin
    usage: /kingdomcore <reload|setlevel|addxp|setkingdom|info>
  level:
    aliases:
      - lvl
      - profile
      - rewards
      - exp
      - xpguide
    description: View character profile, level progression, rewards, and XP guide.
    permission: apexsionscore.command.level
    usage: /level
  rtp:
    aliases:
      - tpr
      - wild
      - wilderness
      - krtp
      - randomteleport
      - rtpkingdom
    description: Random teleport strictly inside your pledged kingdom territory.
    permission: apexsionscore.command.rtp
    usage: /rtp
  tpr:
    description: Safe random teleport strictly inside your pledged kingdom territory.
    permission: apexsionscore.command.rtp
    usage: /tpr
  wild:
    aliases:
      - wilderness
    description: Random teleport strictly inside your pledged kingdom territory.
    permission: apexsionscore.command.rtp
    usage: /wild
  warp:
    aliases:
      - warps
    description: Open warp navigation GUI or teleport to a specific warp location.
    permission: apexsionscore.command.warp
    usage: /warp [name|admin|set|del]
  warps:
    description: Open the interactive warp navigation menu.
    permission: apexsionscore.command.warp
    usage: /warps
  warpmgr:
    aliases:
      - warpadmin
    description: Open interactive Admin Warp Management GUI.
    permission: apexsionscore.warp.admin
    usage: /warpmgr
  admingui:
    aliases:
      - apexadmin
      - aadmin
      - aa
    description: Open the Centralized Master Admin Hub for all Apexsions plugins.
    permission: apexsions.admin.gui
    usage: /admingui [module|reload]
  apexadmin:
    description: Open the Centralized Master Admin Hub for all Apexsions plugins.
    permission: apexsions.admin.gui
    usage: /apexadmin
  aadmin:
    description: Open the Centralized Master Admin Hub for all Apexsions plugins.
    permission: apexsions.admin.gui
  titles:
    aliases:
      - tags
      - title
      - tag
    description: Open the Title Vault GUI to equip prestige titles and honorific badges.
    permission: apexsionscore.command.titles
    usage: /titles
  cosmetics:
    aliases:
      - aura
      - auras
      - trail
      - trails
    description: Open the Particle Cosmetics GUI for Head Auras, Footstep Trails, and Kill Effects.
    permission: apexsionscore.command.cosmetics
    usage: /cosmetics
  rank:
    aliases:
      - ranks
      - ranklist
    description: Open the interactive Rank Hierarchy and Donator Perks menu.
    permission: apexsionscore.command.rank
    usage: /rank
  ranks:
    description: Open the interactive Rank Hierarchy and Donator Perks menu.
    permission: apexsionscore.command.rank
    usage: /ranks
  enchant:
    aliases:
      - customenchant
      - apexenchant
    description: Apply custom or vanilla enchantments exceeding vanilla limits (up to 4x vanilla max level).
    permission: apexsionscore.command.enchant
    usage: /enchant [player] <enchantment> <level>
  customenchant:
    description: Alias for /enchant.
    permission: apexsionscore.command.enchant
    usage: /customenchant [player] <enchantment> <level>
  apexenchant:
    description: Alias for /enchant.
    permission: apexsionscore.command.enchant
    usage: /apexenchant [player] <enchantment> <level>
  kits:
    aliases:
      - kit
    description: Open the Kingdom Kits menu to claim or preview equipment sets.
    permission: apexsionscore.command.kits
    usage: /kits [preview|claim|create|edit|delete|give|resetcooldown|list]
  kit:
    description: Alias for /kits.
    permission: apexsionscore.command.kits
    usage: /kit [preview|claim|create|edit|delete|give|resetcooldown|list]
  kitadmin:
    aliases:
      - kitsadmin
    description: Open the interactive Admin Kit Management GUI.
    permission: apexsions.admin
    usage: /kitadmin
  claim:
    aliases:
      - land
      - landclaim
    description: Sovereign land claiming and territory management.
    usage: /claim [gui|info|trust|untrust|list|unclaim]
  unclaim:
    description: Unclaim the current chunk.
    usage: /unclaim
  trust:
    description: Trust a player in your claimed lands.
    usage: /trust <player>
  untrust:
    description: Revoke trust from a player in your claimed lands.
    usage: /untrust <player>
  claiminfo:
    description: View claim information and display visual particle boundaries.
    usage: /claiminfo
  ban:
    description: Authoritative moderation ban command.
    permission: apexsions.admin.ban
    usage: /ban <player> [duration] [reason...]
  tempban:
    description: Authoritative temporary moderation ban command.
    permission: apexsions.admin.ban
    usage: /tempban <player> <duration> [reason...]
  unban:
    aliases:
      - pardon
    description: Authoritative moderation unban / pardon command.
    permission: apexsions.admin.unban
    usage: /unban <player|uuid> [reason...]
  pardon:
    description: Alias for /unban.
    permission: apexsions.admin.unban
    usage: /pardon <player|uuid> [reason...]
  banip:
    description: Authoritative network IP ban command.
    permission: apexsions.admin.banip
    usage: /banip <player|ip> [duration] [reason...]
  unbanip:
    aliases:
      - pardonip
    description: Authoritative network IP unban / pardon command.
    permission: apexsions.admin.unban
    usage: /unbanip <ip>
  pardonip:
    description: Alias for /unbanip.
    permission: apexsions.admin.unban
    usage: /pardonip <ip>
  checkban:
    aliases:
      - baninfo
    description: Check the active ban status of a player.
    permission: apexsions.admin.ban
    usage: /checkban <player>
  banlist:
    description: View all currently active bans.
    permission: apexsions.admin.ban
    usage: /banlist

permissions:
  apexsions.claim.use:
    description: Allows claiming lands.
    default: true
  apexsions.claim.unlimited:
    description: Allows unlimited land claiming.
    default: op
  apexsions.admin.bypass.claim:
    description: Allows bypassing land claim protections.
    default: op
  apexsions.staff.alerts:
    description: Allows receiving anti-xray security alerts.
    default: op
  apexsionscore.command.enchant:
    description: Allows applying custom enchantments with 4x multiplier.
    default: op
  apexsionscore.enchant.bypass:
    description: Allows bypassing the 4x level multiplier up to server absolute hardcap.
    default: op

  apexsionscore.command.rank:
    description: Allows viewing the Rank Hierarchy GUI.
    default: true
  apexsionscore.command.titles:
    description: Allows accessing the Title Vault GUI.
    default: true
  apexsionscore.command.cosmetics:
    description: Allows accessing the Particle Cosmetics GUI.
    default: true
  apexsions.admin.gui:
    description: Allows accessing the Centralized Master Admin Hub (/admingui).
    default: op
  apexsionscore.command.warp:
    description: Allows using /warp and accessing public server warps.
    default: true
  apexsionscore.warp.admin:
    description: Allows managing warps, setting warps, and opening /warpmgr.
    default: op
  apexsionscore.warp.bypass:
    description: Bypasses warp teleportation countdown delay.
    default: op
  apexsionscore.command.link:
    description: Allows linking in-game account to web account.
    default: true
  apexsionscore.command.lobby:
    description: Allows teleporting to the lobby.
    default: true
  apexsionscore.command.region:
    description: Allows teleporting to the player's realm/kingdom.
    default: true
  apexsionscore.command.level:
    description: Allows accessing level, profile, rewards, and XP guide.
    default: true
  apexsionscore.command.rtp:
    description: Allows random teleporting inside player's kingdom territory.
    default: true
  apexsionscore.rtp.bypass:
    description: Bypasses /rtp cooldown timer.
    default: op
  apexsionscore.admin:
    description: Allows access to administrative commands.
    default: op
  apexsionscore.admin.*:
    description: Wildcard administrative access for ApexsionsCore.
    default: op
    children:
      apexsionscore.admin: true
  apexionscore.command.lobby:
    default: true
  apexionscore.command.region:
    default: true
  apexionscore.command.level:
    default: true
  apexionscore.command.rtp:
    default: true
  apexionscore.admin:
    default: op
  kingdomcore.command.lobby:
    default: true
  kingdomcore.command.kingdom:
    default: true
  kingdomcore.command.level:
    default: true
  kingdomcore.command.rtp:
    default: true
  kingdomcore.admin:
    default: op
  apexsions.vanish:
    description: Allows entering vanish mode.
    default: op
  apexsions.vanish.see:
    description: Allows seeing vanished players in world and in TAB list.
    default: op
  apexsions.vanish.others:
    description: Allows toggling vanish for other players.
    default: op
  apexsions.core.deathcoords:
    description: Allows viewing own death coordinates.
    default: true
  apexsions.core.deathcoords.others:
    description: Allows staff to view other players' death coordinates.
    default: op
  apexsions.core.deathcoords.tp:
    description: Allows staff to teleport to death coordinates.
    default: op
  apexsions.grave.use:
    description: Allows using the grave / tombstone system.
    default: true
  apexsions.grave.admin:
    description: Allows inspecting and force-releasing other players' graves.
    default: op
  apexsions.bounty.use:
    description: Allows placing and viewing player bounties.
    default: true
  apexsions.bounty.admin:
    description: Allows clearing and admin-setting player bounties.
    default: op
  apexsions.container.use:
    description: Allows sorting open containers and quick-depositing items.
    default: true
  apexsions.caravan.use:
    description: Allows opening the Black Market Caravan shop.
    default: true
  apexsions.caravan.admin:
    description: Allows spawning, despawning and reloading the caravan.
    default: op
  apexsions.pose.sit:
    description: Allows sitting on ground or chairs.
    default: true
  apexsions.pose.lay:
    description: Allows laying down.
    default: true
  apexsions.pose.crawl:
    description: Allows crawling through 1-block spaces.
    default: true
  apexsions.pose.bellyflop:
    description: Allows belly flop pose.
    default: true
  apexsions.pose.spin:
    description: Allows spinning pose.
    default: true
  apexsions.pose.admin:
    description: Allows forcing or toggling poses for other players.
    default: op
