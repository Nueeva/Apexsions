# ==============================================================================
# Apexsions — KingdomCore Main Configuration (config.yml)
# Modular YAMLs: kingdoms.yml, titles.yml, xp.yml, rewards.yml, messages.yml, gui.yml
# ==============================================================================

server:
  name: "Apexsions"

database:
  # Database type: 'postgresql' (production standard) or 'sqlite' / 'h2' (local dev fallback)
  type: "postgresql"
  host: "localhost"
  port: 5432
  database: "kingdomcore"
  username: "postgres"
  password: "password"
  pool:
    maximum-pool-size: 10
    minimum-idle: 2
    idle-timeout: 600000
    connection-timeout: 30000
    max-lifetime: 1800000
  # Automatically fallback to local SQLite (database.db) if PostgreSQL cannot be reached
  auto-fallback: true

locations:
  lobby:
    world: "world"
    x: 0.5
    y: 100.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

spawn:
  # Pemain yang telah memilih kerajaan otomatis respawn di ibukota kerajaan saat mati (jika tidak ada bed/anchor)
  respawn-at-kingdom: true
  # Jika true, pemain SELALU respawn di ibukota kerajaan saat mati mengabaikan kasur/bed spawn
  override-bed-spawn: false

level:
  min: 1
  max: 100
  # XP Formula: QUADRATIC: EXP = (a * L^2) + (b * L) -> Default: EXP = (510 * L^2) - (10 * L)
  # Tipe formula:
  #   - QUADRATIC (default): (a * L^2) + (b * L)
  #   - MULTIPLIER (legacy): base * multiplier^(level-1)
  #   - EXPONENT (legacy): base * level^exponent
  formula:
    type: "QUADRATIC"
    a: 510
    b: -10
    # Parameter legacy (opsional jika type diubah ke MULTIPLIER / EXPONENT)
    base: 100
    multiplier: 1.1
    exponent: 1.5
  # Behavior on max level (100): allow_overflow (true) or cap_xp (false)
  allow-overflow: false

bluemap:
  enabled: true
  # Path to BlueMap world.conf (relative to server root or plugins/BlueMap/maps/world.conf)
  config-path: "world.conf"
  # Synchronize kingdom spawn locations with BlueMap marker positions
  sync-spawns: true
  # Display title/actionbar when player walks into kingdom territory
  territory-actionbar: true

# Sistem Pelacakan Koordinat Kematian (/deathcoords, /lastdeath, /kor)
death-coords:
  enabled: true
  # Kirim kartu koordinat kematian otomatis ke chat setelah respawn
  notify-on-respawn: true
  # Jeda pengiriman pesan setelah respawn dalam tick (20 ticks = 1 detik)
  notify-delay-ticks: 20
  # URL dasar satelit BlueMap untuk tombol [Buka Peta 3D]
  bluemap-base-url: "http://apexsions.my.id:32076/"

# ==============================================================================
# Player Grave / Tombstone (/grave, /tombstone, /nisan)
# ==============================================================================
grave:
  enabled: true
  # Lama nisan bertahan sebelum item dilepas (detik). Default 30 menit.
  duration-seconds: 1800
  # Jarak maksimal (blok) untuk membuka nisan lewat /grave atau tap Interaction
  interact-distance: 3.5
  # Izinkan anggota kerajaan yang sama ikut membuka nisan
  allow-kingdom-members: false
  # Arahkan kompas otomatis ke nisan saat respawn
  auto-compass-on-respawn: true

# ==============================================================================
# Player Bounty System (/bounty, /buronan)
# ==============================================================================
bounty:
  enabled: true
  # Jumlah minimum untuk memasang bounty (rupiah)
  min-amount: 1000.0
  # Pajak / server fee saat bounty diklaim (persen, 0 = tanpa pajak)
  tax-percent: 5.0
  # Blokir bounty jika target & pembunuh berada di kerajaan yang sama
  block-same-kingdom: true
  # Blokir klaim jika target & pembunuh terdeteksi dari IP yang sama (anti-abuse)
  block-same-ip: true
  # Minimal waktu online sesi pembunuh (detik) sebelum boleh mengklaim bounty
  min-online-time-seconds: 300
  # Broadcast pengumuman ke seluruh server saat bounty diklaim
  broadcast-claim: true
  # Maksimum bounty yang tampil di /bounty list
  list-limit: 10

# ==============================================================================
# Smart Mob Stacking Engine (Optimasi TPS & FPS pemain Bedrock)
# Menggabungkan gerombolan mob identik menjadi satu entitas berlabel [xN].
# Killing satu unit mengurangi counter; sisa unit di-spawn ulang sehingga
# drop loot & XP tetap setara vanilla.
# ==============================================================================
mob-stacking:
  enabled: true
  # Radius penggabungan mob identik (blok)
  merge-radius: 6.0
  # Ukuran stack maksimum per entitas
  max-stack-size: 50
  # Gabungkan mob segera setelah spawn (spawner/farm)
  merge-on-spawn: true
  # Jangan gabungkan mob dengan custom name (mis. pet bernama)
  respect-custom-names: true
  # Interval sapuan penggabungan mob lama (tick, 20 tick = 1 detik)
  scan-interval-ticks: 100
  # Batas jumlah entitas diproses per sapuan (proteksi lag)
  scan-entities-per-pass: 4000
  # Dunia yang diaktifkan (kosong = semua dunia)
  worlds: []
  # Tipe entitas yang tidak pernah digabung
  ignored-types:
    - VILLAGER
    - WANDERING_TRADER
    - IRON_GOLEM
    - SNOW_GOLEM
    - ALLAY
    - AXOLOTL
    - BEE
    - PARROT
    - WOLF
    - CAT
    - HORSE
    - DONKEY
    - MULE
    - LLAMA
    - CAMEL
    - SNIFFER
    - FROG
    - TADPOLE
    - ARMOR_STAND
  # Alasan spawn yang tidak digabung
  ignored-spawn-reasons:
    - BEEHIVE
    - BUILD_IRONGOLEM
    - BUILD_SNOWMAN
    - BREEDING
    - EGG
    - CURED
    - VILLAGE_DEFENSE
    - VILLAGE_INVASION
    - RAID
    - COMMAND
    - CUSTOM
    - SPAWNER_EGG
    - DISPENSE_EGG
  # Membunuh seluruh sisa stack saat pemain berjongkok (sneak/shift) memberi pukulan maut
  kill-all-on-sneak: true
  # Mob grinder: jika mob mati karena jatuh (fall damage), seluruh sisa stack mati & drop loot/XP
  kill-stack-on-fall: true
  # Hentikan loop spawn pengganti jika mob mati jatuh ke void
  instant-kill-on-void: true
  display:
    name-format: "<gray>%type% <yellow>[x%count%]</yellow>"

# ==============================================================================
# Dropped Item Stacking & Hologram System
# ==============================================================================
# Menggabungkan item drop identik menjadi 1 entitas dengan hologram nama & jumlah,
# mendukung penumpukan melebihi batas 64 vanilla (misal 2 stack cobblestone -> x128).
# Menghemat entitas server TPS dan menjaga kelancaran FPS klien.
# ==============================================================================
item-stacking:
  enabled: true
  # Radius penggabungan item drop terdekat (blok)
  merge-radius: 3.5
  # Batas maksimum jumlah tumpukan per entitas di tanah
  max-stack-size: 10000
  # Gabungkan item otomatis begitu di-drop atau di-mine
  merge-on-spawn: true
  # Tampilkan hologram pada item tunggal (x1)
  show-single: true
  # Hanya gabungkan item yang dasarnya dapat di-stack (maxStackSize > 1)
  stack-only-stackables: true
  # Interval sapuan penggabungan item di dunia aktif (tick, 20 tick = 1 detik)
  scan-interval-ticks: 40
  # Batas entitas item diproses per sapuan (proteksi performa)
  scan-entities-per-pass: 2000
  # Format hologram tampilan melayang (MiniMessage Kyori Adventure)
  display:
    name-format: "<gold>%name%</gold> <yellow>x%count%</yellow>"
    single-format: "<gold>%name%</gold>"
    show-count-on-single: true
  # Dunia yang diaktifkan (kosong = seluruh dunia)
  worlds: []
  # Material yang diabaikan (tidak pernah digabung/diberi nama kustom)
  ignored-materials: []

# ==============================================================================
# Container Sort & Quick Deposit (/sort, /deposit)
# Dirancang ramah Bedrock: cukup perintah chat, tanpa middle-click / keybind.
# ==============================================================================
container:
  enabled: true
  sort:
    enabled: true
    # Gabungkan tumpukan item sejenis saat merapikan
    merge-stacks: true
  quick-deposit:
    enabled: true
    # Jangan setor item dari slot yang sedang dipegang
    skip-held-slot: true
    # Hanya setor item yang jenisnya sudah ada di dalam peti (mode aman)
    only-existing-types: true
    # Sneak + klik kiri peti untuk setor cepat
    sneak-interact: true

# ==============================================================================
# Wandering Black Market Caravan (/caravan, /kafilah)
# NPC kafilah keliling yang muncul di koordinat rahasia dunia liar selama
# jendela waktu tertentu. Berfungsi sebagai money sink anti-inflasi.
# ==============================================================================
caravan:
  enabled: true
  # Dunia tempat kafilah berkelana
  world: "world"
  # Hari kemunculan (kosong = setiap hari)
  active-days:
    - SATURDAY
    - SUNDAY
  # Lama kafilah bertahan per kemunculan (menit)
  duration-minutes: 120
  # Jarak minimum antar kemunculan (menit)
  gap-minutes: 15
  # Radius acak koordinat spawn dari titik 0,0 (blok)
  zone-radius: 3000
  # Interval siaran petunjuk koordinat (menit)
  announce-interval-minutes: 15
  # Siarkan pengumuman ke seluruh server
  broadcast-announcements: true
  # Interval pemeriksaan jadwal (tick)
  check-interval-ticks: 200
  display-name: "<gradient:#9b59b6:#e74c3c><bold>Kafilah Pasar Gelap</bold></gradient>"
  # Penawaran: pakai material+amount ATAU command dengan %player%
  offers:
    enchanted_golden_apple:
      icon: GOLDEN_APPLE
      display-name: "Apel Emas Terlarang"
      material: ENCHANTED_GOLDEN_APPLE
      amount: 8
      price-currency: "rupiah"
      price: 250000.0
    netherite_scrap:
      icon: NETHERITE_SCRAP
      display-name: "Serpihan Netherite Selundupan"
      material: NETHERITE_SCRAP
      amount: 4
      price-currency: "rupiah"
      price: 400000.0
    mystery_enchant:
      icon: ENCHANTED_BOOK
      display-name: "Kitab Enchant Misterius"
      material: ENCHANTED_BOOK
      amount: 1
      price-currency: "rupiah"
      price: 300000.0
    exclusive_title:
      icon: NAME_TAG
      display-name: "Gelar Eksklusif: Penjelajah Bayangan"
      price-currency: "rupiah"
      price: 750000.0
      command: "lp user %player% permission settemp apexsions.title.shadow true 30d"
    ancient_key:
      icon: TRIPWIRE_HOOK
      display-name: "Kunci Kuno Sions"
      material: TRIPWIRE_HOOK
      amount: 3
      price-currency: "rupiah"
      price: 150000.0
    dragon_breath:
      icon: DRAGON_BREATH
      display-name: "Nafas Naga Murni"
      material: DRAGON_BREATH
      amount: 16
      price-currency: "rupiah"
      price: 200000.0
    totem:
      icon: TOTEM_OF_UNDYING
      display-name: "Totem Keabadian"
      material: TOTEM_OF_UNDYING
      amount: 1
      price-currency: "rupiah"
      price: 500000.0

# ==============================================================================
# Sistem Pose, Emote & Kursi Interaktif (/sit, /lay, /crawl, /spin)
# ==============================================================================
pose:
  # Notifikasi status pada Action Bar (contoh: "Tekan SHIFT untuk berdiri")
  actionbar-notification: true
  # Interaksi klik kanan kursi (tangga & slab)
  chairs:
    enabled: true
    # Jarak maksimal blok untuk menduduki kursi (blok)
    distance-limit: 3.5
    allow-stairs: true
    allow-slabs: true

rtp:
  # Cooldown between /rtp uses in seconds (bypass permission: apexsionscore.rtp.bypass)
  cooldown-seconds: 60
  # Maximum retry attempts to find safe location within kingdom polygon
  max-attempts: 30
  # Padding distance from territory polygon borders (blocks)
  boundary-margin: 16

# MOTD kini dikelola secara terpisah melalui file modular motd.yml.
# Pengaturan di bawah tetap berfungsi sebagai fallback jika motd.yml tidak ditemukan.
motd:
  enabled: true
  line-1: "                 <gradient:#c0392b:#8e1b1b><bold>APEXSIONS</bold></gradient> <dark_gray>|</dark_gray> <aqua><bold>26.2</bold></aqua>"
  lines-2:
    - "   <gradient:#00c6ff:#0072ff>⚔ PERANG TIGA KERAJAAN & EKONOMI REALM ⚔</gradient>"
    - "  <gradient:#2ecc71:#f1c40f>🌟 MUSIM BARU TELAH DIBUKA • GABUNG SEKARANG! 🌟</gradient>"
    - "   <gradient:#e74c3c:#f39c12>👑 PILIH KERAJAANMU: ZENITHAR • SOLTERRA • SYLVAMOOR</gradient>"

# ==============================================================================
# Custom Enchantment Command Configuration (/enchant)
# Allows enchantments to exceed vanilla max levels safely via command.
# Formula: Max Level = Vanilla Max Level * multiplier (unless overridden)
# ==============================================================================
enchant:
  # Multiplier applied to vanilla max enchantment levels (e.g. 4x)
  # Sharpness (5) -> 20, Mending (1) -> 4, Unbreaking (3) -> 12, Efficiency (5) -> 20
  multiplier: 4
  # Absolute hardcap to prevent integer overflow
  max-absolute-level: 255
  # Per-enchantment custom overrides (keys in lowercase)
  overrides:
    protection: 12

# ==============================================================================
# Anvil Enhancement Configuration
# Allows anvil repair and enchant combinations without "Too Expensive!" limits.
# ==============================================================================
anvil:
  # Mengaktifkan bypass batas "Too Expensive!" (vanilla mengunci pada level 40)
  remove-too-expensive: true
  # Batas maksimal repair cost (0 = tanpa batas / berapapun biayanya tetap bisa diproses)
  # Jika diatur > 0 (misal 39), biaya EXP akan dicap agar tidak melebihi angka tersebut
  cost-cap: 0
  # Nilai maksimum repair cost yang diizinkan server
  max-repair-cost: 2147483647
  # Mengizinkan kombinasi custom enchant (Sharpness 20, Protection 12, dll) tanpa di-reset ke vanilla
  bypass-enchant-limits: true

# ==============================================================================
# Web Platform Bridge Integration (web.apexsions.my.id)
# ==============================================================================
web-bridge:
  enabled: true
  api-url: "http://web.apexsions.my.id/api/apexsions-bridge"
  api-key: "apexsions_bridge_key_live_2026"
  link-rewards:
    # Mengaktifkan hadiah otomatis in-game saat pemain berhasil menjalankan /link <pin>
    enabled: true
    # Hadiah Kingdom EXP
    xp: 50
    # Hadiah Koin / Mata Uang Ekonomi
    coins: 10000.0
    # Siarkan pesan pengumuman ke seluruh server saat pemain menautkan akun
    broadcast: true

# ==============================================================================
# Sions Temporal Reconstruction Engine (Lore Ancient Civilization Self-Repair)
# Automatically resets and restores all modified blocks in Kerajaan Sions hourly.
# ==============================================================================
sions-temporal:
  enabled: true
  # Interval rekonstruksi temporal dalam hitungan menit (default 60 menit = 1 jam)
  interval-minutes: 60
  # Mencegah pemain mengeksploitasi drop item/exp dari block Sions sebelum di-restore
  prevent-item-drops: true
  # Siarkan pengumuman rekonstruksi ke seluruh server (false = hanya pemain di Sions)
  broadcast-server: false
  # Kembalikan semua block saat server shutdown/restart agar wilayah selalu bersih
  restore-on-shutdown: true
  # Rentang ketinggian pemindaian baseline struktur Sions (/sions set)
  scan:
    default-min-y: 50
    default-max-y: 200
  # Penguncian peti & kontainer kuno di wilayah Sions dengan sistem 3-Tier Kunci
  container-lock:
    enabled: true
    # Apakah kunci dikonsumsi (berkurang 1) saat membuka peti pertama kali dalam siklus temporal
    consume-key: true
    # Pemetaan jenis blok container secara otomatis ke tier kunci:
    # COMMON: CHEST, BARREL
    # ELITE: TRAPPED_CHEST, DISPENSER, DROPPER, HOPPER, FURNACE, BLAST_FURNACE, SMOKER
    # BOSS: SHULKER_BOX, ENDER_CHEST, VAULT
    keys:
      common:
        material: "TRIPWIRE_HOOK"
        name: "<gradient:#bdc3c7:#7f8c8d><bold>Kunci Kuno Sions</bold></gradient>"
        lore:
          - "<gray>Kunci perunggu berkarat yang diselubungi</gray>"
          - "<gray>energi samar reruntuhan masa lampau.</gray>"
          - ""
          - "<yellow>Tingkat:</yellow> <white>Biasa (Common)</white>"
          - "<yellow>Kegunaan:</yellow> <gray>Membuka Peti & Tong Reruntuhan Sions</gray>"
      elite:
        material: "AMETHYST_SHARD"
        name: "<gradient:#f1c40f:#d35400><bold>Kunci Khazanah Ksatria Sions</bold></gradient>"
        lore:
          - "<gold>Kunci kristal berkilauan yang ditempa</gold>"
          - "<gold>oleh para ksatria pelindung imperium.</gold>"
          - ""
          - "<yellow>Tingkat:</yellow> <gold><bold>Elit (Elite)</bold></gold>"
          - "<yellow>Kegunaan:</yellow> <gray>Membuka Peti Jebakan & Khazanah Ksatria</gray>"
      boss:
        material: "ECHO_SHARD"
        name: "<gradient:#9b59b6:#e74c3c><bold>Kunci Void Kaisar Valerius</bold></gradient>"
        lore:
          - "<dark_purple>Kunci pusaka yang bergetar hebat memancarkan</dark_purple>"
          - "<dark_purple>kekuatan kehampaan terdalam Dimensi Void.</dark_purple>"
          - ""
          - "<yellow>Tingkat:</yellow> <light_purple><bold>Kaisar (Raid Boss Tier)</bold></light_purple>"
          - "<yellow>Kegunaan:</yellow> <gray>Membuka Peti Shulker Pusaka Tahta Kaisar</gray>"

# ==============================================================================
# Apexsions Security & Anti-Cheat Suite
# Mitigates Fly Hack, Speed, Jesus, NoFall, Auth Bypass, KillAura, Reach, & BadPackets
# ==============================================================================
security:
  enabled: true
  movement:
    enabled: true
    fly-hack-detection: true
    speed-detection: true
    jesus-waterwalk: true
    nofall-verification: true
    max-violations-before-staff-alert: 6
  auth-gatekeeper:
    enabled: true
    staff-shield: true
    max-failed-attempts: 3
    temp-block-minutes: 10
  combat:
    enabled: true
    killaura-check: true
    max-reach: 4.2
    max-killaura-angle: 95.0
    max-cps: 20
  packet-exploits:
    enabled: true
    bad-packets-pitch: true
    fast-place-scaffold: true
    chest-stealer-limiter: true

# ==============================================================================
# Single-Player Sleep Subsystem
# Cukup 1 pemain tidur di kasur untuk melewati malam (PLAYERS_SLEEPING_PERCENTAGE = 0)
# ==============================================================================
sleep:
  enabled: true
  single-player-sleep: true
  broadcast-sleep: true
  broadcast-morning: true
  clear-weather-on-morning: true

