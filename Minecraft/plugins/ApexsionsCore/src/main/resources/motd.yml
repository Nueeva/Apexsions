# ==============================================================================
#                 APEXSIONS — MOTD CONFIGURATION (motd.yml)
# ==============================================================================

# Aktifkan atau nonaktifkan custom MOTD server
enabled: true

# Baris pertama : Nama Server & Tagline Resmi (Clean & Minimalist)
line-1: "             <gradient:#c0392b:#8e1b1b><bold>APEXSIONS</bold></gradient> <dark_gray>|</dark_gray> <aqua><bold>1.21 - 1.26.2</bold></aqua>"

# Baris kedua: Versi Dukungan (Center-Aligned)
lines-2:
  - "                   <gray>The Peak Civilizations</gray>"

# Pengaturan Jumlah Slot Pemain di Tampilan Server List
player-count:
  # Jika true, slot maksimal server list akan mengikuti angka max-players di bawah
  custom-max-players: false
  max-players: 100

  # Jika true, slot maksimal akan otomatis selalu (jumlah pemain online saat ini + 1)
  just-one-more-slot: false
