# ==============================================================================
# Apexsions — Level Progression & Milestone Rewards (rewards.yml)
# Special Milestone Rewards on levels: 11, 21, 31, 41, 51, 61, 71, 81, 91, 100
# Supported placeholders in commands/messages: %player%, %level%, %kingdom%
# ==============================================================================

settings:
  gui-title: "<dark_gray><bold>🏆 Level Progression Rewards 🏆</bold></dark_gray>"
  gui-size: 54
  auto-claim: false

# Default template for levels not explicitly configured
default-reward:
  icon: "GOLD_NUGGET"
  display-name: "<yellow>Level %level% Bounty</yellow>"
  lore:
    - "<gray>Standard level advancement reward."
    - "<green>• 150 Currency & Kingdom Tokens</green>"
  commands:
    - "eco give %player% 150"

# Specific rewards for each level (1-100)
rewards:
  2:
    display-name: "<yellow>Level 2 Starter Pack</yellow>"
    icon: "BREAD"
    lore:
      - "<gray>Rewards:"
      - "<green>• 16x Bread</green>"
      - "<green>• 100 Currency</green>"
    commands:
      - "give %player% bread 16"
      - "eco give %player% 100"

  5:
    display-name: "<yellow>Level 5 Explorer's Satchel</yellow>"
    icon: "IRON_INGOT"
    lore:
      - "<gray>Rewards:"
      - "<green>• 8x Iron Ingot</green>"
      - "<green>• 250 Currency</green>"
    commands:
      - "give %player% iron_ingot 8"
      - "eco give %player% 250"

  10:
    display-name: "<yellow>Level 10 Vanguard Bounty</yellow>"
    icon: "GOLD_INGOT"
    lore:
      - "<gray>Rewards:"
      - "<green>• 4x Gold Ingot</green>"
      - "<green>• 500 Currency</green>"
    commands:
      - "give %player% gold_ingot 4"
      - "eco give %player% 500"

  # ============================================================================
  # SPECIAL MILESTONE REWARD: LEVEL 11 (Novice Tier Unlocked)
  # ============================================================================
  11:
    is-milestone: true
    display-name: "<gradient:#ffe900:#f39c12><bold>👑 MILESTONE: Level 11 Ascension</bold></gradient>"
    icon: "ENDER_CHEST"
    lore:
      - "<gold><bold>★ SPECIAL MILESTONE REWARD ★</bold></gold>"
      - "<gray>Milestone tier unlocked:"
      - "<yellow>• 1x Kingdom Novice Crate Key</yellow>"
      - "<yellow>• 5x Diamonds</yellow>"
      - "<yellow>• 1,000 Currency</yellow>"
      - "<yellow>• Permanent Tier Title Unlocked!</yellow>"
    commands:
      - "crate key give %player% novice 1"
      - "give %player% diamond 5"
      - "eco give %player% 1000"
    broadcast: "<gold><bold>Apexsions</bold> » <yellow>%player% has achieved <bold>Level 11 Milestone</bold> in kingdom %kingdom%!</yellow></gold>"
    sound: "UI_TOAST_CHALLENGE_COMPLETE"

  15:
    display-name: "<yellow>Level 15 Guardian Cache</yellow>"
    icon: "LAPIS_LAZULI"
    lore:
      - "<green>• 16x Lapis Lazuli</green>"
      - "<green>• 750 Currency</green>"
    commands:
      - "give %player% lapis_lazuli 16"
      - "eco give %player% 750"

  20:
    display-name: "<yellow>Level 20 Elite Cache</yellow>"
    icon: "DIAMOND"
    lore:
      - "<green>• 3x Diamonds</green>"
      - "<green>• 1,000 Currency</green>"
    commands:
      - "give %player% diamond 3"
      - "eco give %player% 1000"

  # ============================================================================
  # SPECIAL MILESTONE REWARD: LEVEL 21 (Guardian Tier Unlocked)
