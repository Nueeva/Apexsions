  21:
    is-milestone: true
    display-name: "<gradient:#00c6ff:#0072ff><bold>👑 MILESTONE: Level 21 Guardian</bold></gradient>"
    icon: "ENDER_CHEST"
    lore:
      - "<gold><bold>★ SPECIAL MILESTONE REWARD ★</bold></gold>"
