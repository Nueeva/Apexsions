      - "crate key give %player% guardian 1"
      - "give %player% diamond 10"
      - "give %player% netherite_scrap 2"
      - "eco give %player% 2500"
    broadcast: "<gold><bold>Apexsions</bold> » <yellow>%player% has attained <bold>Level 21 Guardian Rank</bold> in %kingdom%!</yellow></gold>"
    sound: "UI_TOAST_CHALLENGE_COMPLETE"

