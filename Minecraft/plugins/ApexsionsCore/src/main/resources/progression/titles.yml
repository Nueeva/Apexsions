    "91-100": "<gradient:#ffeaa7:#ffd700><bold>✦ EMPEROR OF ZENITHAR ✦</bold></gradient>"

  SOLTERRA:
    "1-10": "<#fab1a0>Dune Wanderer</#fab1a0>"
