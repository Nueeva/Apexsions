# ==============================================================================
# ApexsionsEconomy — Core Configuration (config.yml)
# ==============================================================================
# NOTE (M-4): only the keys below are actually read by the plugin code.
# Previously this file documented many more keys (currencies:, trade:,
# auction limits/fees/duration, database.postgresql, ...) that no code ever
# read, so changing them had zero effect. Those dead keys were removed so this
# file never promises behavior the implementation does not have.

database:
  # SQLite database file name inside the plugin's data folder.
  file: "economy.db"

auction:
  # Kingdom tax percentage applied to auction purchases.
  tax-percent: 5.0

bank:
  deposit:
    # Maximum principal allowed per bank deposit transaction.
    max-amount: 100000000.0
