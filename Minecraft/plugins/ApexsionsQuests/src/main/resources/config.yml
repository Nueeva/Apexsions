# ==============================================================================
#           APEXSIONS QUESTS — CONFIGURATION
# ==============================================================================

database:
  type: sqlite # sqlite atau postgresql
  sqlite:
    file: "quests.db"
  postgresql:
    host: "localhost"
    port: 5432
    database: "apexsions"
    username: "postgres"
    password: "password"
    ssl: false
  pool:
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout: 30000

# Pengaturan Login Harian & Kalender 4 Minggu
calendar:
  auto-prompt-on-join: true
  grace-period-hours: 36 # Toleransi waktu sebelum streak di-reset
  catch-up-cost: 5000.0 # Biaya klaim hari yang terlewat pada Hari Spesial 29-31

  # Minggu 1 (Hari 1-7): Awakening
  week-1:
    name: "Minggu 1: Awakening"
    subtitle: "Awal perjalanan peradaban"
    rewards:
      1: { money: 10000.0, core-xp: 50, pass-xp: 50, desc: "Rp 10.000 + 50 Core XP" }
