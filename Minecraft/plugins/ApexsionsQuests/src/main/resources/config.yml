# Pengaturan Daily Quests Engine (Satu Pintu)
quests:
  daily-quests-amount: 4
  daily-rerolls-allowed: 1
  reset-hour-wib: 0

  pool:
    mining_stone:
      type: BREAK_BLOCK
      target: "STONE,COBBLESTONE,DEEPSLATE"
      amount: 128
      title: "Pekerja Tambang"
      desc: "Hancurkan 128 blok batu atau deepslate."
      reward: { money: 50.0, core-xp: 10, pass-xp: 80 }

    mining_iron:
      type: BREAK_BLOCK
      target: "IRON_ORE,DEEPSLATE_IRON_ORE"
      amount: 32
      title: "Pengekstrak Besi"
      desc: "Tambang 32 bijih besi di dalam goa."
      reward: { money: 100.0, core-xp: 20, pass-xp: 110 }

    mining_diamond:
      type: BREAK_BLOCK
      target: "DIAMOND_ORE,DEEPSLATE_DIAMOND_ORE"
      amount: 8
      title: "Pemburu Permata"
      desc: "Temukan dan tambang 8 bijih intan (Diamond Ore)."
      reward: { money: 250.0, core-xp: 25, pass-xp: 120 }

    chopping_wood:
      type: BREAK_BLOCK
      target: "OAK_LOG,BIRCH_LOG,SPRUCE_LOG,DARK_OAK_LOG,JUNGLE_LOG,ACACIA_LOG,MANGROVE_LOG,CHERRY_LOG"
      amount: 64
      title: "Penebang Rimba"
      desc: "Tebang 64 batang kayu gelondongan."
      reward: { money: 60.0, core-xp: 10, pass-xp: 80 }

    farming_crops:
      type: HARVEST_CROPS
      target: "WHEAT,CARROTS,POTATOES,BEETROOTS,NETHER_WART"
      amount: 64
      title: "Panen Melimpah"
      desc: "Panen 64 tanaman matang di ladang."
      reward: { money: 50.0, core-xp: 15, pass-xp: 90 }

    fishing_catch:
      type: FISH
      target: "ANY"
      amount: 15
      title: "Nelayan Handal"
      desc: "Tangkap 15 ikan atau harta karun dari perairan."
      reward: { money: 60.0, core-xp: 15, pass-xp: 100 }

    hunting_monsters:
      type: KILL_ENTITY
      target: "ZOMBIE,SKELETON,SPIDER,CREEPER"
      amount: 25
      title: "Penjaga Malam"
      desc: "Kalahkan 25 monster agresif malam."
      reward: { money: 100.0, core-xp: 20, pass-xp: 110 }

    hunting_endermen:
      type: KILL_ENTITY
      target: "ENDERMAN"
      amount: 5
      title: "Penakluk Bayangan"
      desc: "Kalahkan 5 makhluk Enderman."
      reward: { money: 150.0, core-xp: 25, pass-xp: 120 }

    crafting_tools:
      type: CRAFT_ITEM
      target: "IRON_PICKAXE,DIAMOND_PICKAXE,IRON_SWORD,DIAMOND_SWORD"
      amount: 3
      title: "Pandai Besi"
      desc: "Rakit 3 peralatan besi atau diamond."
      reward: { money: 80.0, core-xp: 15, pass-xp: 90 }
