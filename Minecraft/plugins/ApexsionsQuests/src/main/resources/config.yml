# ==============================================================================
#           APEXSIONS QUESTS — CONFIGURATION
# ==============================================================================

database:
  type: sqlite # sqlite atau postgresql
  sqlite:
    file: "quests.db"
  postgresql:
    host: "localhost"
    port: 5432
    database: "apexsions"
    username: "postgres"
    password: "password"
    ssl: false
  pool:
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout: 30000

# Pengaturan Login Harian & Kalender 4 Minggu
calendar:
  auto-prompt-on-join: true
  grace-period-hours: 36 # Toleransi waktu sebelum streak di-reset
  catch-up-cost: 250.0 # Biaya klaim hari yang terlewat pada Hari Spesial 29-31 (setara 1 diamond di shop)

  # Minggu 1 (Hari 1-7): Awakening
  week-1:
    name: "Minggu 1: Awakening"
    subtitle: "Awal perjalanan peradaban"
    rewards:
      1: { money: 50.0, core-xp: 5, pass-xp: 60, desc: "Rp 50 + 5 Core XP" }
      2: { money: 60.0, core-xp: 5, pass-xp: 60, desc: "Rp 60 + 60 Pass XP" }
      3: { money: 75.0, core-xp: 10, pass-xp: 60, desc: "Rp 75 + Roti Suplai" }
      4: { money: 90.0, core-xp: 10, pass-xp: 60, desc: "Rp 90 + 10 Core XP" }
      5: { money: 100.0, core-xp: 15, pass-xp: 60, desc: "Rp 100 + 60 Pass XP" }
      6: { money: 125.0, core-xp: 15, pass-xp: 60, desc: "Rp 125 + Iron Ingot" }
      7: { money: 200.0, core-xp: 30, pass-xp: 100, crate-key: "starter", desc: "Rp 200 + Starter Crate Key" }

  # Minggu 2 (Hari 8-14): Prosperity
