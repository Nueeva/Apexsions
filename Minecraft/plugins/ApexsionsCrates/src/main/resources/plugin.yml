main: com.apexsions.crates.ApexsionsCratesPlugin
version: '1.0.0'
name: ApexsionsCrates
author: Nueeva
description: Luxury Crate, Key, and Milestone Progression Ecosystem for Apexsions.
depend: [ nightcore ]
softdepend:
  - ApexsionsCore
  - ApexsionsEconomy
  - ApexsionsShop
  - ApexsionsBattlepass
  - PlaceholderAPI
  - ProtocolLib
  - packetevents
api-version: '1.21'

commands:
  crateshop:
    aliases:
      - keyshop
      - cratekeyshop
    description: Buka Toko Pembelian Crate Keys Resmi Apexsions.
    usage: /crateshop [admin|reload]