# ==============================================================================
#                  APEXSIONS CRATE — LUXURY CRATE PRESET
# ==============================================================================
id: "luxury"
name: "<gradient:#f39c12:#f1c40f><bold>PETI LUXURY</bold></gradient>"
block-material: "ENDER_CHEST"
animation-type: "ROULETTE" # ROULETTE, INSTANT, IN_WORLD
required-key: "luxury"
hologram:
  enabled: true
  lines:
    - "<gradient:#f39c12:#f1c40f><bold>✦ PETI LUXURY KERAJAAN ✦</bold></gradient>"
    - "<gray>Klik-Kiri untuk <yellow>Preview Hadiah</yellow></gray>"
    - "<gray>Klik-Kanan dengan <gold>Kunci Luxury</gold> untuk Buka</gray>"

# Milestone pity progression
milestones:
  10:
    name: "<green>Milestone 10 Buka</green>"
    reward-commands:
      - "give %player% diamond 16"
      - "eco give %player% 5000"
    broadcast: "<yellow>★ %player% telah mencapai Milestone 10 Peti Luxury!</yellow>"
  25:
    name: "<gold>Milestone 25 Buka</gold>"
    reward-commands:
      - "crate key give %player% mythic 1"
    broadcast: "<gold>★ %player% mencapai Milestone 25 Peti Luxury dan mendapatkan Kunci Mythic!</gold>"

# Pool of rewards with weighted chance
rewards:
  coins_large:
    name: "<gold><bold>50.000 Apex Coins</bold></gold>"
    rarity: "RARE"
    weight: 25.0
    material: "GOLD_BLOCK"
    commands:
      - "eco give %player% 50000"
    economy-currency: "coins"
    economy-amount: 50000
    core-xp: 50
    battlepass-xp: 25

  diamond_set:
    name: "<aqua><bold>Set Armor Berlian Kerajaan</bold></aqua>"
    rarity: "RARE"
    weight: 20.0
    material: "DIAMOND_CHESTPLATE"
    commands:
      - "give %player% diamond_helmet 1"
      - "give %player% diamond_chestplate 1"
      - "give %player% diamond_leggings 1"
      - "give %player% diamond_boots 1"
    core-xp: 100
    battlepass-xp: 40

  netherite_ingots:
    name: "<dark_purple><bold>4x Netherite Ingot</bold></dark_purple>"
    rarity: "EPIC"
    weight: 12.0
    material: "NETHERITE_INGOT"
    amount: 4
    commands:
      - "give %player% netherite_ingot 4"
    core-xp: 150
    battlepass-xp: 60

  mythic_key_drop:
    name: "<gradient:#9b59b6:#8e44ad><bold>2x Kunci Peti Mythic</bold></gradient>"
    rarity: "LEGENDARY"
    weight: 5.0
    material: "TRIPWIRE_HOOK"
    commands:
      - "crate key give %player% mythic 2"
    broadcast: true
    core-xp: 250
    battlepass-xp: 100

  apex_crown:
    name: "<gradient:#ff4757:#2ed573><bold>Mahkota Keemasan Apex</bold></gradient>"
    rarity: "APEX"
    weight: 1.5
    material: "NETHERITE_HELMET"
    commands:
      - "give %player% netherite_helmet[custom_name='{\"text\":\"Mahkota Apex\",\"color\":\"gold\",\"bold\":true}',enchantments={protection:4,unbreaking:3,mending:1}] 1"
      - "broadcast <gradient:#ff4757:#ffa502><bold>JACKPOT! %player% memenangkan Mahkota Keemasan Apex dari Peti Luxury!</bold></gradient>"
    broadcast: true
    core-xp: 500
    battlepass-xp: 250

  copper_trash:
    name: "<gray>32x Blok Tembaga</gray>"
    rarity: "COMMON"
    weight: 36.5
    material: "COPPER_BLOCK"
    amount: 32
    commands:
      - "give %player% copper_block 32"
    core-xp: 10
    battlepass-xp: 10
