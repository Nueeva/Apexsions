# ==============================================================================
#                  APEXSIONS CRATE — MYTHIC CRATE PRESET
# ==============================================================================
id: "mythic"
name: "<gradient:#9b59b6:#8e44ad><bold>PETI MYTHIC</bold></gradient>"
block-material: "RESPAWN_ANCHOR"
animation-type: "SELECTABLE" # ROULETTE, INSTANT, IN_WORLD, SELECTABLE
required-key: "mythic"
hologram:
  enabled: true
  lines:
    - "<gradient:#9b59b6:#8e44ad><bold>✦ PETI MYTHIC PURBA ✦</bold></gradient>"
    - "<gray>Klik-Kiri: <yellow>Preview Hadiah</yellow></gray>"
    - "<gray>Klik-Kanan dengan <light_purple>Kunci Mythic</light_purple> untuk Buka</gray>"

# Milestone pity progression
milestones:
  5:
    name: "<light_purple>Milestone 5 Buka</light_purple>"
    reward-commands:
      - "eco give %player% 75000"
      - "crate key give %player% mythic 1"
    broadcast: "<light_purple>★ %player% mencapai Milestone 5 Peti Mythic!</light_purple>"
  15:
    name: "<gradient:#ff4757:#2ed573><bold>Milestone 15 Buka (Jackpot)</bold></gradient>"
    reward-commands:
      - "crate key give %player% apex 1"
      - "eco give %player% 250000"
    broadcast: "<gradient:#ff4757:#ffa502><bold>★ %player% mencapai Milestone 15 Peti Mythic dan dihadiahi KUNCI APEX!</bold></gradient>"

# Pool of rewards with weighted chance
rewards:
  relic_blade:
    name: "<gradient:#e056fd:#be2edd><bold>Pedang Pusaka Netherite Mythic</bold></gradient>"
    rarity: "MYTHIC"
    weight: 4.0
    material: "NETHERITE_SWORD"
    commands:
      - "give %player% netherite_sword[custom_name='{\"text\":\"Pedang Pusaka Mythic\",\"color\":\"dark_purple\",\"bold\":true}',enchantments={sharpness:6,unbreaking:3,looting:3,fire_aspect:2}] 1"
    broadcast: true
    core-xp: 400
    battlepass-xp: 200

  apex_key:
    name: "<gradient:#ff4757:#2ed573><bold>1x Kunci Peti Tertinggi Apex</bold></gradient>"
    rarity: "APEX"
    weight: 2.5
    material: "TRIPWIRE_HOOK"
    commands:
      - "crate key give %player% apex 1"
    broadcast: true
    core-xp: 500
    battlepass-xp: 300

  huge_coins:
    name: "<gold><bold>150.000 Apex Coins</bold></gold>"
    rarity: "LEGENDARY"
    weight: 15.0
    material: "GOLD_BLOCK"
    commands:
      - "eco give %player% 150000"
    economy-currency: "coins"
    economy-amount: 150000
    core-xp: 200
    battlepass-xp: 100

  elytra_wings:
    name: "<gradient:#70a1ff:#1e90ff><bold>Sayap Elytra Kerajaan</bold></gradient>"
    rarity: "LEGENDARY"
    weight: 8.5
    material: "ELYTRA"
    commands:
      - "give %player% elytra[custom_name='{\"text\":\"Sayap Elytra Kerajaan\",\"color\":\"aqua\",\"bold\":true}',enchantments={unbreaking:3,mending:1}] 1"
    broadcast: true
    core-xp: 300
    battlepass-xp: 150

  netherite_blocks:
    name: "<dark_purple><bold>2x Blok Netherite Murni</bold></dark_purple>"
    rarity: "EPIC"
    weight: 20.0
    material: "NETHERITE_BLOCK"
    amount: 2
    commands:
      - "give %player% netherite_block 2"
    core-xp: 150
    battlepass-xp: 75

  totem_bundle:
    name: "<yellow><bold>3x Totem of Undying</bold></yellow>"
    rarity: "RARE"
    weight: 50.0
    material: "TOTEM_OF_UNDYING"
    amount: 3
    commands:
      - "give %player% totem_of_undying 3"
    core-xp: 100
    battlepass-xp: 50
