# ==============================================================================
#           APEXSIONS JOBS — CONFIGURATION
# ==============================================================================

database:
  type: sqlite # sqlite atau postgresql
  sqlite:
    file: "jobs.db"
  postgresql:
    host: "localhost"
    port: 5432
    database: "apexsions"
    username: "postgres"
    password: "password"
    ssl: false
  pool:
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout: 30000

# Pengaturan Keamanan & Anti-Abuse
anti-abuse:
  placed-blocks-protection: true # Blok yang ditaruh player tidak memberi uang saat ditambang
  spawner-mob-multiplier: 0.1 # Mob dari Spawner hanya memberi 10% gaji/EXP (mencegah AFK farm)
  daily-base-cap: 150000.0 # Gaji maksimal harian dasar (Lv. 1)
  daily-cap-per-level: 10000.0 # Tambahan batas gaji harian per kenaikan level job

# Integrasi Pajak Kerajaan (ApexsionsCore)
kingdom-tax:
  enabled: true
  tax-rate: 0.05 # 5% dari pendapatan kerja otomatis disetorkan ke Kas Kerajaan pemain

