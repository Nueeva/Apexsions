# ========================================================
# APEXSIONS SHOP - MAIN CONFIGURATION
# ========================================================

economy:
  currency-name: "Rupiah"
  currency-symbol: "Rp "
  # Rasio harga jual terhadap harga beli (20% = 0.20)
  sell-ratio: 0.20

tax:
  # Tarif pajak default (persen)
  default-tax-percent: 10.0
  # Otomatis mengambil tarif pajak dari ApexsionsCore jika tersedia
  use-core-kingdom-tax: true
  # Tampilkan rincian pajak pada lore item
  show-tax-in-lore: true

dynamic-pricing:
  enabled: true
  # Detail cuaca dan pasar wilayah berada di markets.yml
