# ==============================================================================
# ApexsionsCustomEnchants — Luxury Custom Enchantment Engine
# ==============================================================================

settings:
  # Multiplier harga pembelian buku spesifik di Toko Buku (/ce shop) dibanding harga gacha random
  specific-book-price-multiplier: 3.0

  # Persentase peluang sukses default untuk buku yang dibeli spesifik
  specific-book-success-chance: 50.0

  # Persentase peluang hancur default jika aplikasi buku gagal
  specific-book-destroy-chance: 30.0

  # Sound effects
  sounds:
    apply-success: "ENTITY_PLAYER_LEVELUP"
    apply-failure: "ITEM_SHIELD_BREAK"
    destroy-item: "ENTITY_ITEM_BREAK"
    dust-apply: "BLOCK_ENCHANTMENT_TABLE_USE"

tinkerer:
  enabled: false
  status: "coming_soon"

enchanting-table:
  enabled: true
  # Peluang trigger custom enchant per tombol meja sihir
  button-0-chance: 25.0  # Tombol 1 (Lv 1-10)
  button-1-chance: 50.0  # Tombol 2 (Lv 11-20)
  button-2-chance: 80.0  # Tombol 3 (Lv 30)
  # Fitur spesial tombol 3 (Level 30)
  button-2-double-chance: 15.0 # Peluang mendapatkan 2 custom enchant sekaligus
  button-2-level-2-bonus-chance: 20.0 # Peluang mulai langsung di Level II

messages:
  prefix: "<gradient:#9b59b6:#e74c3c><bold>✦ SIHIR APEXSIONS ✦</bold></gradient> "
  no-permission: "<red>Kamu tidak memiliki izin untuk melakukan ini!</red>"
  book-applied: "<green><bold>✓ BERHASIL!</bold> Sihir <gold>%enchant% %level%</gold> berhasil diterapkan ke itemmu!</green>"
  book-failed: "<red><bold>✖ GAGAL!</bold> Sihir gagal meresap ke dalam item!</red>"
  book-destroyed: "<red><bold>☠ HANCUR!</bold> Item hancur lebur karena energi sihir yang tidak stabil!</red>"
  white-scroll-saved: "<aqua><bold>🛡 WHITE SCROLL AKTIF!</bold> Itemmu terlindungi dari kehancuran!</aqua>"
  not-enough-money: "<red>Saldo %currency% kamu tidak mencukupi! Dibutuhkan: <gold>%amount%</gold></red>"
  limit-reached: "<red><bold>✖ BATAS MAKSIMAL TERCAPAI!</bold> Item ini sudah mencapai batas maksimal sihirmu (<gold>%limit% custom enchant</gold>)!</red>"

enchant-limits:
  # Batasan default custom enchant per item jika tidak memiliki rank/permission khusus
  default: 4
  # Batas custom enchant berdasarkan rank server (-1 untuk unlimited)
  ranks:
    wanderer: 4
    ascendant: 5
    archon: 6
    sovereign: 7
    emperor: 8
    sions: 9
    herald: -1
    warden: -1
    architect: -1
    overseer: -1
    ancestor: -1
