    description: "Mengirimkan block drop langsung ke inventory tanpa jatuh."

  harvest:
    display: "Harvest"
    group: LEGENDARY
    max-level: 3
    applies: "PICKAXE"
    description: "Menambang area 3x3 secara serentak."

  gemify:
    display: "Gemify"
    group: FABLED
    max-level: 3
    applies: "PICKAXE"
    description: "Peluang mengubah bongkahan batu menjadi permata berharga."

  unbreakable:
    display: "Unbreakable"
    group: FABLED
    max-level: 1
    applies: "ALL"
    description: "Membuat item kebal dari segala jenis kerusakan."

  # Bows
  multiarrow:
    display: "MultiArrow"
    group: ULTIMATE
    max-level: 3
    applies: "BOW"
    description: "Menembakkan beberapa anak panah sekaligus dalam satu tembakan."

  sniper:
    display: "Sniper"
    group: LEGENDARY
    max-level: 3
    applies: "BOW"
    description: "Meningkatkan kecepatan anak panah dan memberikan bonus damage jarak jauh."

  piercingarrow:
    display: "Piercing"
    group: ELITE
    max-level: 3
    applies: "BOW"
    description: "Anak panah menembus pertahanan baju zirah lawan."

  # Heroic (God Tier - Coming Soon)
  godlyslayer:
    display: "GodlySlayer"
    group: HEROIC
    max-level: 5
    applies: "SWORD"
    description: "Kekuatan dewa penumpas kegelapan."

  immortality:
    display: "Immortality"
    group: HEROIC
    max-level: 3
    applies: "CHESTPLATE"
    description: "Ketahanan mutlak para dewa."
